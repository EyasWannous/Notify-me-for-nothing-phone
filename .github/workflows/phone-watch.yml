name: phone-watch

on:
  schedule:
    - cron: "17 5 * * *"        # every day 09:17 UAE time (cron is in UTC)
    - cron: "7,37 * 26-30 11 *" # twice an hour on 26-30 Nov (Black Friday + Cyber Monday)
  workflow_dispatch: {}          # lets you press "Run workflow" manually (and the Telegram /start does this)

permissions:
  contents: write                # needed to commit state.json / history.csv back

concurrency:
  group: phone-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run checks
        run: dotnet run -c Release -- .
        env:
          SEND_SUMMARY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * *' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state and history
        run: |
          git config user.name "phonewatch-bot"
          git config user.email "phonewatch-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          # Keep our fresh results aside, then always build the commit on top of the LATEST remote branch.
          # (Avoids "pull --rebase" conflicts when someone changed or deleted these files while the check was running.)
          mkdir -p "$RUNNER_TEMP/keep"
          cp -f state.json history.csv "$RUNNER_TEMP/keep/" 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp -f "$RUNNER_TEMP/keep/state.json" "$RUNNER_TEMP/keep/history.csv" . 2>/dev/null || true
            git add state.json history.csv 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nothing to save."; break; fi
            git commit -m "check $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin "HEAD:$BRANCH"; then break; fi
            echo "Push failed (attempt $attempt), retrying..."; sleep 5
          done